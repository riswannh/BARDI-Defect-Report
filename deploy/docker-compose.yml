# ============================================================================
# Compose PRODUKSI — dipakai DI SERVER (VPS).
# Berbeda dari docker-compose.yml di root repo yang untuk development lokal.
#
# Cara pakai di server:
#   1. mkdir -p /opt/bardi && cd /opt/bardi
#   2. salin berkas ini + Caddyfile + backup.sh ke folder itu
#   3. buat .env berisi BETTER_AUTH_SECRET dan DOMAIN
#   4. docker compose up -d
#
# Aplikasi TIDAK membuka port ke internet (tanpa "ports:") — hanya Caddy yang
# menghadap keluar, dan app dijangkau lewat jaringan internal Docker.
# ============================================================================

services:
  app:
    # Image dibangun di mesin development lalu dipindah lewat docker save/load.
    # Sengaja TANPA "build:" supaya server tidak perlu Node/npm sama sekali.
    image: bardi-defect-report:latest
    container_name: bardi-app
    restart: unless-stopped
    environment:
      DB_FILE_NAME: /data/sqlite.db
      # WAJIB alamat publik, bukan localhost — kalau salah, login gagal dari
      # browser pengguna.
      BETTER_AUTH_URL: https://${DOMAIN}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      # Kunci service account Google untuk fitur "Sync Google Sheet" (tab
      # "Big Data"). Aplikasi membaca sheet itu, dan hanya menulis SATU kolom:
      # "Problem" (J). Kolom A:H, K, L diisi formula dan tidak pernah ditulis.
      GOOGLE_SERVICE_ACCOUNT_FILE: /run/secrets/gsheet-sa.json
      # Layanan terjemahan (service `libretranslate` di bawah) untuk kolom
      # "Keterangan Kendala": teks Indonesia diterjemahkan ke Inggris sebelum
      # disimpan. Nama host = nama service di jaringan internal Docker.
      TRANSLATE_URL: http://libretranslate:5000
      TRANSLATE_TIMEOUT_MS: "20000"
    volumes:
      # Database + backup otomatis (backup-*.db) tinggal di folder ini.
      - ./data:/data
      - ./secrets/service-account.json:/run/secrets/gsheet-sa.json:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Terjemahan Indonesia -> Inggris (LibreTranslate self-host, mesin Argos).
  # Dipakai sync Google Sheet; nanti juga gelembung chat tiket.
  #
  # Dijalankan PERMANEN di VPS (bukan container sementara saat uji). Port hanya
  # di-bind ke loopback server supaya bisa diuji dari laptop lewat tunnel SSH:
  #   ssh -N -L 5150:127.0.0.1:5001 root@<vps>
  # Tidak pernah terbuka ke internet; app memakai jaringan internal Docker.
  # Model diunduh sekali ke volume (butuh internet saat start pertama).
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: bardi-libretranslate
    restart: unless-stopped
    environment:
      # VPS ini tanpa swap: batasi thread, memori, dan model yang dimuat.
      LT_LOAD_ONLY: en,id
      LT_THREADS: "2"
      LT_CHAR_LIMIT: "5000"
      LT_DISABLE_WEB_UI: "true"
      LT_UPDATE_MODELS: "false"
      ARGOS_CHUNK_TYPE: MINISBD
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - libretranslate_models:/home/libretranslate/.local
    mem_limit: 1.2g
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/languages', timeout=5).status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

  # Reverse proxy + HTTPS otomatis (sertifikat diurus Caddy, tidak perlu cron
  # certbot). Cukup arahkan domain ke IP VPS lalu Caddy menerbitkan sertifikatnya.
  caddy:
    image: caddy:2-alpine
    container_name: bardi-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
  libretranslate_models:
