services:
  app:
    build:
      context: ./frontend
    image: bardi-defect-report:latest
    container_name: bardi-defect-report
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_FILE_NAME: /data/sqlite.db
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-ubah-secret-ini-minimal-32-karakter}
      # Terjemahan "Keterangan Kendala" (id -> en). Nama host = service di bawah.
      TRANSLATE_URL: http://libretranslate:5000
    volumes:
      - ./data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # Terjemahan lokal untuk development — tidak wajib hidup: kalau mati, baris
  # baru dari sync ditunda (bukan disimpan dalam bahasa Indonesia).
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: bardi-libretranslate
    restart: unless-stopped
    ports:
      # Hanya untuk coba-coba dari host (mis. curl ke /translate).
      - "5000:5000"
    environment:
      LT_LOAD_ONLY: en,id
      LT_THREADS: "2"
      LT_CHAR_LIMIT: "5000"
      LT_DISABLE_WEB_UI: "true"
      LT_UPDATE_MODELS: "false"
      ARGOS_CHUNK_TYPE: MINISBD
    volumes:
      - libretranslate_models:/home/libretranslate/.local
    mem_limit: 1.2g
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/languages', timeout=5).status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  libretranslate_models:
